name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra excel --extra web --extra rest --extra mcp --extra openai_compatible --extra dev
      - name: ruff
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy src

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra excel --extra web --extra rest --extra mcp --extra openai_compatible --extra dev
      - name: pytest (live-system tests skip without the stack)
        run: uv run pytest -q
      - name: examples (stages 1-3, no LLM)
        run: |
          uv run python examples/expense_review/run.py --out "${{ runner.temp }}/expense"
          uv run python examples/ticket_triage/run.py --out "${{ runner.temp }}/triage"

  live-systems:
    # Brings up the real Directus, Keycloak, and Odoo from examples/systems and
    # runs every live test and both cross-system examples against them.
    #
    # The stack and the cross-system examples are submodules under
    # github.com/aster-test-generation.
    # The other jobs do not check them out: their live tests skip.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra web --extra dev
      - name: start the live systems
        run: docker compose -f examples/systems/compose.yaml up -d
      - name: provision them and write .env
        run: uv run python examples/systems/setup.py
      - name: live tests
        run: uv run pytest -q -m live -rs
      - name: cross-system examples (stages 1-4, no LLM)
        run: |
          uv run python examples/order_fulfillment/run.py --out "${{ runner.temp }}/fulfillment"
          uv run python examples/hire_to_onboard/run.py --out "${{ runner.temp }}/onboard"
      - name: the container runner (Podman/Docker only)
        run: examples/systems/run.sh order_fulfillment
      - name: logs on failure
        if: failure()
        run: docker compose -f examples/systems/compose.yaml logs --tail 200

  core-only:
    # The core install has no extras: domains, channels, and agents that need
    # one must skip cleanly rather than fail on import.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run pytest -q

  mining-r:
    # Exercises the bupaR bridge against a real R install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::bupaR
            any::dplyr
            any::lubridate
            any::jsonlite
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra excel --extra dev
      - run: uv run pytest -q tests/mining

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - name: install the wheel into a clean environment and smoke-test it
        run: |
          uv venv /tmp/clean
          VIRTUAL_ENV=/tmp/clean uv pip install "$(ls dist/*.whl)[excel]"
          cd /tmp && /tmp/clean/bin/agenticharvest tools
          /tmp/clean/bin/agenticharvest sample sqlite /tmp/s.db
          /tmp/clean/bin/agenticharvest call list_tables path=/tmp/s.db
